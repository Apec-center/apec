<title>Контент APEC v2 · песочница</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700&family=Unbounded:wght@600;700&display=swap">
<style>
/* Раскладка и токены как в CRM APEC Center: панель раздела слева (264px), рабочая область справа, белые карточки с рамкой, радиус 14. На телефоне панель становится полосой сверху. */
:root{
  --primary:#5D87FF; --primary-h:#4a76f0; --primary-l:#ECF2FF; --primary-08:rgba(93,135,255,.08);
  --success:#26AE74; --success-l:#E6F7EF; --warning:#FFAE1F; --warning-l:#FEF5E5; --warning-t:#A86C00;
  --error:#FA896B; --error-l:#FDEDE8; --error-t:#E4572E; --violet:#7460EE; --violet-l:#EFEBFD;
  --text:#2A3547; --text-2:#5A6A85; --text-3:#7C8FAC; --border:#E5EAEF; --input:#DFE5EF;
  --bg:#F6F7F9; --hover:#F6F9FC; --card:#fff; --r:14px; --rc:7px;
  --pop:0 0 1px rgba(0,0,0,.31),0 12px 28px -6px rgba(0,0,0,.18);
  --hover-border:#c6d3ea; --danger-border:#f7c4b6; --toast-bg:#2A3547;
  --font:'Onest',Helvetica,Arial,sans-serif; color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --primary-h:#7A9CFF; --primary-l:rgba(93,135,255,.18); --primary-08:rgba(93,135,255,.14);
  --success-l:rgba(38,174,116,.18); --warning-l:rgba(255,174,31,.16); --warning-t:#FFC861;
  --error-l:rgba(250,137,107,.16); --error-t:#FF9B80; --violet:#9C8CFF; --violet-l:rgba(116,96,238,.24);
  --text:#EAEFF4; --text-2:#A7B3C8; --text-3:#8394B0; --border:#333F55; --input:#3E4B63;
  --bg:#202936; --hover:#2F3A50; --card:#2A3447;
  --pop:0 0 1px rgba(0,0,0,.6),0 12px 28px -6px rgba(0,0,0,.55);
  --hover-border:#4A5A78; --danger-border:rgba(250,137,107,.45); --toast-bg:#3A4660; color-scheme:dark}}
:root[data-theme="dark"]{
  --primary-h:#7A9CFF; --primary-l:rgba(93,135,255,.18); --primary-08:rgba(93,135,255,.14);
  --success-l:rgba(38,174,116,.18); --warning-l:rgba(255,174,31,.16); --warning-t:#FFC861;
  --error-l:rgba(250,137,107,.16); --error-t:#FF9B80; --violet:#9C8CFF; --violet-l:rgba(116,96,238,.24);
  --text:#EAEFF4; --text-2:#A7B3C8; --text-3:#8394B0; --border:#333F55; --input:#3E4B63;
  --bg:#202936; --hover:#2F3A50; --card:#2A3447;
  --pop:0 0 1px rgba(0,0,0,.6),0 12px 28px -6px rgba(0,0,0,.55);
  --hover-border:#4A5A78; --danger-border:rgba(250,137,107,.45); --toast-bg:#3A4660; color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--text);font:400 14px/1.52 var(--font);-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
.app{display:grid;grid-template-columns:264px minmax(0,1fr);height:100%}
.rail{background:var(--card);border-right:1px solid var(--border);display:flex;flex-direction:column;overflow-y:auto;min-width:0}
.brand{display:flex;align-items:center;gap:12px;padding:16px 16px 12px}
.brand .ib{width:40px;height:40px;border-radius:10px;display:grid;place-items:center;flex:none;background:var(--primary-l);color:var(--primary);font-weight:700;font-size:15px}
.brand b{display:block;font-size:16px;font-weight:700;line-height:1.2}
.brand small{display:flex;align-items:center;gap:6px;color:var(--text-2);font-size:12.5px;margin-top:2px}
.brand small i{width:7px;height:7px;border-radius:50%;background:var(--warning)}
.nav{display:flex;flex-direction:column;gap:2px;padding:4px 12px}
.nav button{width:100%;display:flex;justify-content:space-between;align-items:center;gap:8px;height:40px;padding:0 12px;border:0;background:none;border-radius:8px;cursor:pointer;color:var(--text);text-align:left;font-size:14px}
.nav button:hover{background:var(--hover)}
.nav button[aria-current=page]{background:var(--primary-08);color:var(--primary);font-weight:600}
.nav .sep{height:1px;background:var(--border);margin:8px 12px}
.badge{min-width:20px;height:20px;padding:0 6px;border-radius:10px;font-size:12px;font-weight:600;display:grid;place-items:center;background:var(--warning-l);color:var(--warning-t)}
.rail-foot{margin-top:auto;border-top:1px solid var(--border);padding:12px 16px;display:flex;flex-direction:column;gap:10px;font-size:12.5px}
.rail-foot label{display:flex;flex-direction:column;gap:4px;color:var(--text-2)}
.main{overflow-y:auto;min-width:0}
.page{max-width:1240px;margin:0 auto;padding:20px 24px 40px;display:flex;flex-direction:column;gap:16px}
h1{font-size:21px;font-weight:700;margin:0;line-height:1.2}
h2{font-size:16px;font-weight:600;margin:0}
.sub{color:var(--text-2);margin:3px 0 0;max-width:68ch}
.head{display:flex;justify-content:space-between;gap:12px;align-items:flex-start;flex-wrap:wrap}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--border);overflow-x:auto}
.tabs button{background:none;border:0;border-bottom:2px solid transparent;padding:8px 12px;cursor:pointer;color:var(--text-2);white-space:nowrap}
.tabs button[aria-selected=true]{color:var(--primary);border-color:var(--primary);font-weight:600}
.card{background:var(--card);border:1px solid var(--border);border-radius:var(--r);padding:20px}
.grid{display:grid;gap:16px;grid-template-columns:repeat(auto-fill,minmax(240px,1fr))}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:40px;padding:6px 16px;border-radius:var(--rc);border:0;background:var(--primary);color:#fff;cursor:pointer;white-space:nowrap;font-size:14px;line-height:1}
.btn:hover{background:var(--primary-h)}
.btn.ghost{background:none;border:1px solid rgba(93,135,255,.5);color:var(--primary);padding:5px 15px}
.btn.ghost:hover{background:var(--primary-08);border-color:var(--primary)}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.btn.sm{height:32px;padding:4px 12px;font-size:13px}
.btn.ghost.sm{padding:3px 11px}
:focus-visible{outline:2px solid var(--primary);outline-offset:2px}
.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.field>span{font-size:13px;font-weight:600;color:var(--text)}
.field small{color:var(--text-2);font-size:13px}
input[type=text],select,textarea{background:var(--card);border:1px solid var(--input);border-radius:var(--rc);padding:8px 12px;width:100%;min-width:0;min-height:40px}
input[type=text]:focus,select:focus,textarea:focus{border-color:var(--primary);outline:0}
textarea{min-height:84px;resize:vertical}
.chip{display:inline-block;border-radius:99px;padding:1px 9px;font-size:12px;font-weight:600;background:var(--primary-l);color:var(--primary)}
.chip.ok{background:var(--success-l);color:var(--success)}
.chip.warn{background:var(--warning-l);color:var(--warning-t)}
.chip.mute{background:var(--bg);color:var(--text-2)}
.chip.vio{background:var(--violet-l);color:var(--violet)}
.empty{border:1px dashed var(--input);border-radius:var(--r);padding:20px;color:var(--text-2)}
.empty b{color:var(--text)}
.muted{color:var(--text-2)}
table{border-collapse:collapse;width:100%}
th,td{text-align:left;padding:10px 12px;border-bottom:1px solid var(--border);vertical-align:top}
th{font-size:12px;font-weight:600;color:var(--text-2);text-transform:uppercase;letter-spacing:.3px}
.scroll{overflow-x:auto}
.kanban{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(230px,1fr);gap:12px;overflow-x:auto;padding-bottom:6px}
.col{background:var(--bg);border:1px solid var(--border);border-radius:var(--r);padding:12px;display:flex;flex-direction:column;gap:8px;min-height:120px}
.col h3{margin:0;font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:.3px;color:var(--text-2);display:flex;justify-content:space-between;gap:8px}
.col.gate{border-color:var(--warning);background:var(--warning-l)}
.item{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:10px;display:flex;flex-direction:column;gap:6px}
.pill-row{display:flex;flex-wrap:wrap;gap:6px}
.mx{display:grid;gap:8px;min-width:620px}
.mx div{min-width:0}
.cellbox{border:1px solid var(--border);border-radius:8px;padding:10px;background:var(--card);min-height:56px}
.cellbox.zero{border-style:dashed;color:var(--text-3)}
.kv{display:grid;grid-template-columns:150px minmax(0,1fr);gap:4px 12px}
.kv dt{color:var(--text-2)} .kv dd{margin:0;min-width:0;overflow-wrap:anywhere}
.num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.statnum{font-size:28px;font-weight:700;font-variant-numeric:tabular-nums;margin:4px 0}
.toast{position:fixed;bottom:calc(16px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);background:var(--toast-bg);color:#fff;padding:8px 16px;border-radius:8px;box-shadow:var(--pop);z-index:9}
@media (max-width:900px){
  .app{grid-template-columns:minmax(0,1fr);grid-template-rows:auto minmax(0,1fr)}
  .rail{flex-direction:row;align-items:center;border-right:0;border-bottom:1px solid var(--border);overflow-x:auto;overflow-y:hidden}
  .brand{padding:8px 8px 8px 16px;white-space:nowrap}.brand small{display:none}
  .nav{flex-direction:row;padding:4px 8px}.nav button{width:auto;white-space:nowrap;flex:none}.nav .sep{display:none}
  .rail-foot{margin:0;border:0;flex-direction:row;padding:4px 16px 4px 8px}.rail-foot label span{display:none}
  .page{padding:16px 16px 40px}
  .kv{grid-template-columns:minmax(0,1fr)}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<div class="app">
  <aside class="rail">
    <div class="brand"><span class="ib">A</span><div><b>Контент APEC</b><small><i></i>v2 · песочница</small></div></div>
    <nav class="nav" id="nav" aria-label="Разделы"></nav>
    <div class="rail-foot">
      <label><span>Смотреть как</span><select id="role" aria-label="Роль"></select></label>
      <label><span>Тема</span><select id="theme" aria-label="Тема"><option value="">Как в системе</option><option value="light">Светлая</option><option value="dark">Тёмная</option></select></label>
    </div>
  </aside>
  <main class="main"><div class="page" id="page"></div></main>
</div>

<script>
"use strict";
/* ---------- справочники ---------- */
const SECTIONS=[
  {id:"strategy",name:"Стратегия",freq:"раз в месяц"},
  {id:"pulse",name:"Пульс",freq:"ежедневно"},
  {id:"matrix",name:"Матрица",freq:"раз в месяц + по сигналам"},
  {id:"production",name:"Производство",freq:"ежедневно"},
  {id:"creators",name:"Креаторы",freq:"ежедневно"},
  {id:"media",name:"Медиа-студия",freq:"ежедневно"},
  {id:"settings",name:"Настройки",freq:"по необходимости"}
];
const ROLES={
  producer:{name:"Продюсер",see:["strategy","pulse","matrix","production","creators","media","settings"],edit:true},
  editor:{name:"Редактор",see:["pulse","matrix","production","media"],edit:true},
  speaker:{name:"Спикер",see:["creators","production"],edit:false},
  ambassador:{name:"Амбассадор",see:["creators"],edit:false},
  analyst:{name:"Таргетолог / аналитик",see:["pulse","matrix"],edit:false}
};
const STAGES=["Безразличие","Осознание проблемы","Выбор решения","Выбор поставщика","Готов купить"];
const PESO={P:"Paid · реклама",E:"Earned · упоминания",S:"Shared · соцсети",O:"Owned · свои площадки"};
const CH_STATUS={active:"Ведём",planned:"Позже",absent:"Нет"};
/* стадии темы; gate = ворота, на которых тема ждёт решения продюсера */
const FLOW=[
  {id:"idea",name:"Темы на период",gate:1,next:"hooks"},
  {id:"hooks",name:"Пишем тезисы и хуки",who:"Claude"},
  {id:"hooks_review",name:"Тезисы и хуки",gate:2,next:"script",back:"hooks"},
  {id:"script",name:"Пишем сценарий",who:"Claude"},
  {id:"script_review",name:"Финальный сценарий",gate:3,next:"production",back:"script"},
  {id:"production",name:"Производство"},
  {id:"ready",name:"Готово к выпуску"},
  {id:"published",name:"Опубликовано"}
];
const CRM_RULES={forbid:["АТЭС","виза (про карту)","гарантия одобрения","работа по карте","Япония / Австралия / Новая Зеландия","цены чужих виз","скидки","ложная срочность"]};

/* ---------- состояние ---------- */
const S={pr:{view:"kanban",open:null,busy:{},prog:"",sel:{},ret:{},preview:{}},mx:{tab:"map",sel:null,draft:{},pf:"",busy:false,sig:{busy:false,prog:"",props:[]},tp:{busy:false,props:[],period:"2 недели",err:""},cellBusy:false},mcp:null,pulse:{days:30,busy:false,prog:"",err:""},sample:null,chat:{open:false,turns:[],msgs:[],busy:false,input:"",ctl:null},role:"producer",section:"strategy",tab:{},db:null,canWrite:false,data:{strategy_versions:[],strategy_draft:null,segments:[],channels:[],products:[],topics:[],integrations:[],stats:[],cells:[],signals:[],pieces:[]}};
const $=s=>document.querySelector(s);
function h(tag,attrs,...kids){const e=document.createElement(tag);
  for(const[k,v]of Object.entries(attrs||{})){if(k==="class")e.className=v;else if(k.startsWith("on"))e.addEventListener(k.slice(2),v);else if(v===true)e.setAttribute(k,"");else if(v!==false&&v!=null)e.setAttribute(k,v)}
  for(const k of kids.flat()){if(k==null||k===false)continue;e.append(k.nodeType?k:document.createTextNode(String(k)))}return e}
function lsGet(k){try{return localStorage.getItem(k)}catch{return null}}
function lsSet(k,v){try{localStorage.setItem(k,v)}catch{}}
function toast(t){const e=h("div",{class:"toast",role:"status"},t);document.body.append(e);setTimeout(()=>e.remove(),2200)}
const can=()=>ROLES[S.role].edit&&S.canWrite;

/* ---------- данные (db) ---------- */
const COLS={strategy_versions:"strategy_versions",segments:"segments",channels:"channels",products:"products",topics:"topics",integrations:"integrations",stats:"stats",cells:"cells",signals:"signals",pieces:"pieces"};
function listen(name){
  S.db.collection(COLS[name]).onSnapshot(snap=>{S.data[name]=snap.docs.map(d=>({id:d.id,...d.data()}));render()},e=>console.warn(name,e.code));
}
async function write(fn,okMsg){
  try{await fn();if(okMsg)toast(okMsg)}catch(e){toast(e&&e.code==="invalid_argument"?"Нет прав на запись":"Не сохранилось, попробуйте ещё раз")}
}
const col=n=>S.db.collection(COLS[n]);

/* ---------- каркас ---------- */
function inboxCount(){return S.data.topics.filter(t=>{const f=FLOW.find(x=>x.id===t.stage);return f&&f.gate}).length}
function renderNav(){
  const nav=$("#nav");nav.replaceChildren();
  const vis=SECTIONS.filter(s=>ROLES[S.role].see.includes(s.id));
  vis.forEach(s=>{
    if(s.id==="settings")nav.append(h("div",{class:"sep"}));
    const n=s.id==="production"&&inboxCount()?h("span",{class:"badge",title:"Ждёт вашего решения"},inboxCount()):null;
    nav.append(h("button",{"aria-current":S.section===s.id?"page":null,onclick:()=>go(s.id)},s.name,n));
  });
}
function go(id){S.section=id;lsSet("v2.section",id);render();$(".main").scrollTop=0}
function render(){
  const vis=ROLES[S.role].see;if(!vis.includes(S.section))S.section=vis[0];
  renderNav();
  const p=$("#page");p.replaceChildren();
  ({strategy:vStrategy,pulse:vPulse,matrix:vMatrix,production:vProduction,creators:vCreators,media:vMedia,settings:vSettings})[S.section](p);
  if(!S.db)p.prepend(h("div",{class:"empty"},h("b",null,"База не подключена. "),"Откройте страницу в Claude, чтобы видеть и менять данные."));
  else if(!can()&&ROLES[S.role].edit)p.prepend(h("div",{class:"empty"},"У вас доступ только на чтение. Чтобы менять данные, нужен доступ «Участник» или выше."));
}
function head(title,sub,right){return h("div",{class:"head"},h("div",null,h("h1",null,title),sub&&h("p",{class:"sub"},sub)),right)}
function tabs(key,items,paint,p){
  const cur=S.tab[key]||items[0][0];
  p.append(h("div",{class:"tabs",role:"tablist"},items.map(([id,name])=>h("button",{role:"tab","aria-selected":cur===id,onclick:()=>{S.tab[key]=id;render()}},name))));
  paint(cur,p);
}
function later(stage,what){return h("div",{class:"empty"},h("b",null,what),h("br"),"Появится на этапе "+stage+" плана сборки. Структура и данные под него уже заложены.")}

/* ---------- 1. Стратегия ---------- */
const PLATFORM_FIELDS=[
  ["mission","Миссия редакции","Кому служим, что даём, какой результат получает человек."],
  ["positioning","Позиционирование","Для кого, что за категория, чем отличаемся, почему нам верить."],
  ["roof","Главное сообщение","Одно предложение, «крыша» message house."],
  ["tov","Тон голоса","Как говорим: 3–4 принципа, на «вы» или «ты», эталонные фразы."],
  ["values","Ценности","Во что верим и чего никогда не делаем."]
];
function vStrategy(p){
  const ver=[...S.data.strategy_versions].sort((a,b)=>b.n-a.n);
  const act=ver[0];
  p.append(head("Стратегия","Бренд-платформа хранится полями. Из них собирается пакет для каждого промпта и проверки судьи.",
    h("div",{class:"row"},act?h("span",{class:"chip ok"},"Действует версия "+act.n):h("span",{class:"chip warn"},"Версий пока нет"))));
  tabs("strategy",[["platform","Платформа"],["channels","Смыслы и каналы"],["versions","Версии"]],(t,p)=>{
    if(t==="platform")platform(p,act);
    if(t==="channels")channelsTab(p);
    if(t==="versions")versionsTab(p,ver);
  },p);
}
function platform(p,act){
  const d=draftValue(act);
  const form=h("form",{class:"card",style:"display:flex;flex-direction:column;gap:14px",onsubmit:e=>e.preventDefault()});
  PLATFORM_FIELDS.forEach(([k,n,hint])=>form.append(h("label",{class:"field"},h("span",null,n),h("textarea",{id:"pf-"+k,disabled:!can(),oninput:e=>{d[k]=e.target.value}},d[k]||""),h("small",null,hint))));
  p.append(form);
  p.append(h("div",{class:"card"},h("h2",null,"Message house: опоры и доказательства"),
    h("p",{class:"muted",style:"margin:4px 0 12px"},"3–4 опоры. Каждая станет рубрикой, а доказательства подмешиваются в генерацию."),
    pillarsEditor(d)));
  p.append(h("div",{class:"card"},h("h2",null,"Запреты стайлгайда"),
    h("p",{class:"muted",style:"margin:4px 0 10px"},"Из книги продаж в CRM. Судья блокирует текст с этими формулировками."),
    h("div",{class:"pill-row"},CRM_RULES.forbid.map(x=>h("span",{class:"chip warn"},x)))));
  p.append(h("div",{class:"row"},
    h("button",{class:"btn",disabled:!can(),onclick:()=>saveVersion(d,act)},"Утвердить как версию "+((act?act.n:0)+1)),
    S.sample&&h("button",{class:"btn ghost",disabled:!can(),onclick:()=>{S.chat.open=!S.chat.open;render()}},S.chat.open?"Скрыть диалог":"Пересмотреть в диалоге")));
  if(S.sample&&S.chat.open)p.append(reviewPanel(d,act));
}
/* пересмотр в диалоге: Claude задаёт вопросы и предлагает правки полей, применяются только в черновик */
const PATCHABLE=["mission","positioning","roof","tov","values"];
function rules(d){
  const f=PLATFORM_FIELDS.map(([k,n])=>n+" ("+k+"): "+(d[k]||"пусто")).join("\n");
  const pl=(d.pillars||[]).map((x,i)=>(i+1)+". "+x.title+" — "+x.proof).join("\n")||"нет";
  return "Ты помогаешь продюсеру APEC Center раз в месяц пересматривать бренд-платформу контента. Говори по-русски, просто, без канцелярита, на «вы».\n"+
  "Бизнес: карта APEC (APEC Business Travel Card) для россиян через МИД РФ, въезд в Таиланд до 90 дней, тарифы 60/90/120 тыс. ₽.\n"+
  "Запрещено писать: слово «АТЭС», «виза» про карту, обещания одобрения, работу по карте, Японию/Австралию/Новую Зеландию, цены чужих виз, скидки, ложную срочность, «визараны умерли».\n"+
  "Не выдумывай цифры, кейсы и факты. Если данных нет, спроси. Сигналов рынка из чатов пока нет в системе, опирайся на поля и ответы продюсера.\n"+

/* судья: шкала 0–100 из конституции, порог 75; любое нарушение запретов режет оценку до 40 */
async function judge(kind,text){
  const prompt="Ты строгий судья контента APEC Center. Оцени "+kind+" по шкале 0–100.\n"+platformCtx()+"\n\nШКАЛА (макс. по пунктам): "+RUBRIC.map(([k,n,m])=>k+" — "+n+" (до "+m+")").join("; ")+
   ". Крючок: до 7 слов, цифра/деньги/срок/риск, останавливает скролл. Конкретика: цифры, сроки, места из фактов выше, никаких общих слов. Повод сохранить или переслать: расчёт, список, шаги. Факты и запреты: любой запрещённый оборот, выдуманная цифра или обещание сверх договора — это нарушение. Призыв: одно действие. Голос: на «вы», живая речь.\n\nТЕКСТ:\n"+text+
   "\n\nОтвет строго JSON: {\"parts\":{\"hook\":0,\"concrete\":0,\"save\":0,\"facts\":0,\"cta\":0,\"voice\":0},\"violations\":[\"что нарушено\"],\"notes\":[\"3–5 конкретных правок\"]}";
  const r=await S.sample.json(prompt,{cache:false});
  const parts={};let total=0;
  RUBRIC.forEach(([k,,m])=>{const v=Math.max(0,Math.min(m,Math.round(Number(r&&r.parts&&r.parts[k])||0)));parts[k]=v;total+=v});
  const violations=(r&&Array.isArray(r.violations)?r.violations:[]).map(String).filter(Boolean).slice(0,6);
  if(violations.length)total=Math.min(total,40);
  return{total,parts,violations,notes:(r&&Array.isArray(r.notes)?r.notes:[]).map(String).slice(0,6),at:new Date().toISOString()};
}
const verdictChip=v=>v?h("span",{class:"chip "+(v.total>=PASS?"ok":"warn"),title:(v.violations||[]).join("; ")},"Судья "+v.total+(v.violations&&v.violations.length?" · нарушения":"")):null;
/* пишем, судим, при оценке ниже порога один раз переписываем по замечаниям, оставляем лучшее */
async function writeJudged(kind,makePrompt,parse){
  let text=parse(await S.sample(makePrompt(""),{cache:false}));let v=await judge(kind,text);
  if(v.total<PASS){const t2=parse(await S.sample(makePrompt("Предыдущая версия получила "+v.total+" из 100. Исправь замечания судьи: "+[...v.violations,...v.notes].join("; ")+"\n\nПредыдущая версия:\n"+text),{cache:false}));
    const v2=await judge(kind,t2);if(v2.total>=v.total){text=t2;v=v2}}
  return{text,verdict:v};
}
